<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Garden State Collective staff reporting portal."><link rel="icon" href="assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-title="Staff portal"><main id="main"><section class="hero"><h1>Staff reports, in one place.</h1><p>File warnings, strikes, appeals, LOA notices and more. Each report type goes to its own Discord channel for Management review.</p><a class="btn primary" href="submit-report.html">Submit a report</a><a class="btn" href="dashboard.html">Open dashboard</a></section>
<h2>Report types</h2><div class="grid" id="types"></div></main>
<script src="config.js"></script><script src="js/app.js"></script><script src="js/reports.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>{GSC_loadTemplates().then(t=>{document.getElementById("types").innerHTML=t.map(x=>`<a class="tile" style="--c:${x.color}" href="submit-report.html#${x.id}"><h3>${GSC.esc(x.title)}</h3><p>${GSC.esc(x.description)}</p></a>`).join("")}).catch(()=>{})})</script></body></html>
