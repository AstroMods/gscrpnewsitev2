<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Review and manage staff reports."><link rel="icon" href="assets/favicon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body data-title="Dashboard"><main id="main"><h1>Report dashboard</h1><div class="stats" id="stats"></div>
<div class="bar"><input id="q" type="search" placeholder="Search reports" aria-label="Search reports"><select id="ft" aria-label="Filter by type"></select><select id="fs" aria-label="Filter by status"></select><button id="csv">Export CSV</button><button id="json">Export JSON</button></div>
<div class="card wrap"><table><thead><tr><th data-k="ref"><button>Reference</button></th><th data-k="title"><button>Type</button></th><th data-k="status"><button>Status</button></th><th data-k="priority"><button>Priority</button></th><th data-k="submittedAt"><button>Submitted</button></th></tr></thead><tbody id="tb"></tbody></table></div>
<div class="actions"><button id="prev">Previous</button><span id="pg" class="hint" style="align-self:center"></span><button id="next">Next</button></div></main><dialog id="detail" aria-label="Report detail"></dialog>
<script src="config.js"></script><script src="js/app.js"></script><script src="js/reports.js"></script><script src="js/dashboard.js"></script></body></html>
